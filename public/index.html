<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
  <title>Story Studio</title>
  <style>
    * { box-sizing: border-box; }
    body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background: #0b0f19; color: #f1f5f9; margin: 0; padding: 18px; padding-bottom: 50px; }
    h1 { font-size: 1.4rem; color: #38bdf8; margin-bottom: 4px; }
    p.sub { font-size: 0.8rem; color: #94a3b8; margin-top: 0; margin-bottom: 16px; }
    label { display: block; font-size: 0.82rem; font-weight: 600; margin-top: 12px; margin-bottom: 5px; color: #cbd5e1; }
    .grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
    select, input, textarea { width: 100%; padding: 12px; border-radius: 8px; border: 1px solid #1e293b; background: #161e2e; color: #fff; font-size: 0.95rem; }
    textarea { height: 90px; resize: vertical; }
    button { width: 100%; padding: 14px; border: none; border-radius: 8px; font-weight: 600; font-size: 0.95rem; cursor: pointer; margin-top: 10px; }
    .btn-story { background: #2563eb; color: #fff; }
    .btn-image { background: #7c3aed; color: #fff; }
    button:disabled { opacity: 0.6; }
    .divider { margin: 24px 0 16px; border-top: 1px solid #1e293b; }
    #storyBox { margin-top: 16px; padding: 16px; background: #161e2e; border: 1px solid #1e293b; border-radius: 8px; line-height: 1.7; white-space: pre-wrap; font-size: 1rem; display: none; }
    #imageBox { margin-top: 16px; text-align: center; display: none; }
    #imageBox img { max-width: 100%; border-radius: 8px; border: 1px solid #334155; }
    .preview-thumb { max-height: 140px; border-radius: 8px; margin-top: 8px; display: none; border: 1px solid #334155; }
    .status-text { font-size: 0.85rem; color: #38bdf8; margin-top: 8px; text-align: center; }
  </style>
</head>
<body>
  <h1>Story Studio</h1>
  <p class="sub">Uncensored narrative and image studio</p>

  <!-- STORY SECTION -->
  <label>Language</label>
  <select id="language">
    <option value="English">English</option>
    <option value="Hindi">Hindi (हिंदी)</option>
    <option value="Bhojpuri">Bhojpuri (भोजपुरी)</option>
  </select>

  <div class="grid-2">
    <div>
      <label>Story Stage</label>
      <select id="stage">
        <option value="Opening / Hook">Opening (Hook)</option>
        <option value="Middle / Plot Development">Story Flow</option>
        <option value="Climax">Dramatic Climax</option>
        <option value="Ending / Resolution">Resolution</option>
        <option value="Complete Short Story">Full Story</option>
      </select>
    </div>
    <div>
      <label>Length</label>
      <select id="length">
        <option value="short (around 200 words)">Short (~200w)</option>
        <option value="medium (around 500 words)" selected>Medium (~500w)</option>
        <option value="long and detailed (around 900+ words)">Long (~900w+)</option>
      </select>
    </div>
  </div>

  <label>Genre / Tone</label>
  <input id="genre" placeholder="e.g. Action Thriller, Romance, Rural Drama" />

  <label>Characters</label>
  <input id="characters" placeholder="e.g. Ramesh, Priya" />

  <label>Premise / Scene Focus</label>
  <textarea id="premise" placeholder="What happens in this story scene?"></textarea>

  <button class="btn-story" id="storyBtn" onclick="runStory()">Write Story Scene</button>
  <div id="storyBox"></div>

  <div class="divider"></div>

  <!-- IMAGE GENERATION SECTION -->
  <label>Visual Style</label>
  <select id="imageStyle">
    <option value="photorealistic, 8k resolution, cinematic lighting, sharp focus">Cinematic / Realism</option>
    <option value="dark fantasy, moody atmosphere, intricate details, cinematic">Dark Fantasy</option>
    <option value="anime aesthetic, detailed manga illustration, vivid colors">Anime / Graphic</option>
    <option value="oil painting on canvas, classical brush strokes, masterpiece">Oil Painting</option>
    <option value="35mm film photograph, realistic film grain, candid shot">Vintage Film</option>
  </select>

  <label>Upload Reference Photo (Optional)</label>
  <input type="file" id="fileInput" accept="image/*" onchange="handleImage(event)" />
  <img id="uploadPreview" class="preview-thumb" alt="Uploaded Preview" />

  <label>Image Prompt</label>
  <textarea id="imgPrompt" placeholder="Describe the scene or transformation..."></textarea>

  <button class="btn-image" id="imgBtn" onclick="runImage()">Generate Picture</button>
  <div id="imageStatus" class="status-text"></div>

  <div id="imageBox"><img id="sceneImg" /></div>

  <script>
    let uploadedImageBase64 = null;

    function handleImage(event) {
      const file = event.target.files[0];
      if (!file) return;

      const reader = new FileReader();
      reader.onload = function(e) {
        const img = new Image();
        img.onload = function() {
          const canvas = document.createElement('canvas');
          let width = img.width;
          let height = img.height;
          const maxDim = 1024;

          if (width > height) {
            if (width > maxDim) {
              height = Math.round((height * maxDim) / width);
              width = maxDim;
            }
          } else {
            if (height > maxDim) {
              width = Math.round((width * maxDim) / height);
              height = maxDim;
            }
          }

          canvas.width = Math.floor(width / 64) * 64;
          canvas.height = Math.floor(height / 64) * 64;

          const ctx = canvas.getContext('2d');
          ctx.drawImage(img, 0, 0, canvas.width, canvas.height);

          const dataUrl = canvas.toDataURL('image/jpeg', 0.85);
          uploadedImageBase64 = dataUrl.split(',')[1];

          const thumb = document.getElementById('uploadPreview');
          thumb.src = dataUrl;
          thumb.style.display = 'block';
        };
        img.src = e.target.result;
      };
      reader.readAsDataURL(file);
    }

    async function runStory() {
      const btn = document.getElementById('storyBtn');
      const box = document.getElementById('storyBox');
      btn.innerText = "Writing...";
      btn.disabled = true;

      try {
        const res = await fetch('/api/generate-story', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            language: document.getElementById('language').value,
            stage: document.getElementById('stage').value,
            length: document.getElementById('length').value,
            genre: document.getElementById('genre').value,
            characters: document.getElementById('characters').value,
            premise: document.getElementById('premise').value
          })
        });
        const data = await res.json();
        box.style.display = 'block';
        box.innerText = data.story || ("Error: " + (data.error || "Server issue"));
      } catch (e) {
        alert("Story generation error");
      }
      btn.innerText = "Write Story Scene";
      btn.disabled = false;
    }

    async function runImage() {
      const btn = document.getElementById('imgBtn');
      const box = document.getElementById('imageBox');
      const img = document.getElementById('sceneImg');
      const status = document.getElementById('imageStatus');
      const prompt = document.getElementById('imgPrompt').value;
      const style = document.getElementById('imageStyle').value;

      if (!prompt.trim()) {
        alert("Please enter a description in the Image Prompt box.");
        return;
      }

      btn.disabled = true;
      status.innerText = "Connecting to Venice AI...";

      try {
        const keyRes = await fetch('/api/config');
        const { key } = await keyRes.json();

                // Venice strict minimal parameters for SDXL
        const payload = {
          model: 'lustify-sdxl',
          prompt: `${prompt}, ${style}`
        };

        // Attach image data if provided (SD img2img parameters)
        if (uploadedImageBase64) {
          payload.init_image = uploadedImageBase64;
          payload.strength = 0.65; // 0.1 preserves original, 0.9 makes radical changes
        }

        status.innerText = "Generating image (takes ~15-20s)...";

        const response = await fetch('https://api.venice.ai/api/v1/image/generate', {
          method: 'POST',
          headers: {
            'Authorization': `Bearer ${key}`,
            'Content-Type': 'application/json'
          },
          body: JSON.stringify(payload)
        });

        const rawText = await response.text();
        let data;
        try {
          data = JSON.parse(rawText);
        } catch(err) {
          throw new Error("Invalid response from server: " + rawText);
        }

        if (data.images && data.images[0]) {
          const result = data.images[0].startsWith('http')
            ? data.images[0]
            : `data:image/webp;base64,${data.images[0]}`;
          img.src = result;
          box.style.display = 'block';
          status.innerText = "";
        } else {
          status.innerText = "";
          alert("Venice API Error:\n" + JSON.stringify(data, null, 2));
        }
      } catch (e) {
        status.innerText = "";
        alert("Execution Error:\n" + e.message);
      }
      btn.disabled = false;
    }
  </script>
</body>
</html>
