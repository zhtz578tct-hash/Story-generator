<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
  <title>Story Studio</title>
  <style>
    * { box-sizing: border-box; }
    body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background: #0b0f19; color: #f1f5f9; margin: 0; padding: 18px; padding-bottom: 50px; }
    h1 { font-size: 1.4rem; color: #38bdf8; margin-bottom: 4px; }
    p.sub { font-size: 0.8rem; color: #94a3b8; margin-top: 0; margin-bottom: 16px; }
    label { display: block; font-size: 0.82rem; font-weight: 600; margin-top: 12px; margin-bottom: 5px; color: #cbd5e1; }
    .grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
    select, input, textarea { width: 100%; padding: 12px; border-radius: 8px; border: 1px solid #1e293b; background: #161e2e; color: #fff; font-size: 0.95rem; }
    textarea { height: 85px; resize: vertical; }
    textarea.tall { height: 140px; }
    .btn-row { display: grid; grid-template-columns: 2fr 1fr; gap: 8px; margin-top: 10px; }
    button { padding: 14px; border: none; border-radius: 8px; font-weight: 600; font-size: 0.95rem; cursor: pointer; }
    .btn-story { background: #2563eb; color: #fff; width: 100%; }
    .btn-clear { background: #334155; color: #f1f5f9; font-size: 0.85rem; }
    .btn-append { background: #0284c7; color: #fff; width: 100%; margin-top: 10px; font-size: 0.85rem; padding: 10px; }
    .btn-image { background: #7c3aed; color: #fff; width: 100%; margin-top: 10px; }
    button:disabled { opacity: 0.6; }
    .divider { margin: 24px 0 16px; border-top: 1px solid #1e293b; }
    #storyBox { margin-top: 16px; padding: 16px; background: #161e2e; border: 1px solid #1e293b; border-radius: 8px; line-height: 1.8; white-space: pre-wrap; font-size: 1.05rem; display: none; }
    #imageBox { margin-top: 16px; text-align: center; display: none; }
    #imageBox img { max-width: 100%; border-radius: 8px; border: 1px solid #334155; }
    .status-text { font-size: 0.85rem; color: #38bdf8; margin-top: 8px; text-align: center; }
  </style>
</head>
<body>
  <h1>Story Studio</h1>
  <p class="sub">Uncensored narrative and scene generation</p>

  <!-- STORY SECTION -->
  <label>Language</label>
  <select id="language">
    <option value="English">English</option>
    <option value="Hindi">Hindi (हिंदी)</option>
    <option value="Bhojpuri">Bhojpuri (भोजपुरी)</option>
  </select>

  <div class="grid-2">
    <div>
      <label>Story Stage</label>
      <select id="stage">
        <option value="Opening / Hook">Opening (Hook)</option>
        <option value="Middle / Plot Development" selected>Story Flow / Continuation</option>
        <option value="Climax">Dramatic Climax</option>
        <option value="Ending / Resolution">Resolution</option>
        <option value="Complete Short Story">Full Story</option>
      </select>
    </div>
    <div>
      <label>Length</label>
      <select id="length">
        <option value="short (around 200 words)">Short (~200w)</option>
        <option value="medium (around 500 words)" selected>Medium (~500w)</option>
        <option value="long and detailed (around 900+ words)">Long (~900w+)</option>
      </select>
    </div>
  </div>

  <label>Genre / Tone</label>
  <input id="genre" placeholder="e.g. Romance, Rural Drama, Action Thriller" />

  <label>Characters</label>
  <input id="characters" placeholder="e.g. Ramesh, Priya" />

  <label>Story So Far / Previous Chapters (No limit — paste past text here for continuity)</label>
  <textarea id="storySoFar" class="tall" placeholder="Paste the previous chapters or story context here so the model maintains the exact plot flow, background events, and tone..."></textarea>

  <label>Next Scene Focus / Immediate Premise</label>
  <textarea id="premise" placeholder="What happens next in this specific upcoming scene?"></textarea>

  <label>Writer's Additional Instructions (Tone, Dialogue style, Twist, Constraints)</label>
  <textarea id="instructions" placeholder="e.g. Keep dialogue natural, slow romantic buildup, introduce mystery..."></textarea>

  <div class="btn-row">
    <button class="btn-story" id="storyBtn" onclick="runStory()">Write Story</button>
    <button class="btn-clear" type="button" onclick="clearStorySection()">Clear</button>
  </div>

  <div id="storyBox"></div>
  <button id="appendBtn" class="btn-append" type="button" onclick="appendToStorySoFar()" style="display:none;">Add Generated Scene to Story So Far</button>

  <div class="divider"></div>

  <!-- IMAGE GENERATION SECTION -->
  <label>Visual Style</label>
  <select id="imageStyle">
    <option value="photorealistic, 8k resolution, raw photography, sharp focus">Cinematic / Realism</option>
    <option value="dark fantasy, moody atmosphere, highly detailed">Dark Fantasy</option>
    <option value="anime aesthetic, clean lines, uncensored illustration">Anime / Graphic</option>
    <option value="fine art oil painting, classical brush strokes">Oil Painting</option>
    <option value="candid 35mm film photograph, raw authentic textures">Vintage Film</option>
  </select>

  <label>Image Prompt (English or Hindi)</label>
  <textarea id="imgPrompt" placeholder="Describe the scene or characters to illustrate..."></textarea>

  <div class="btn-row">
    <button class="btn-image" id="imgBtn" onclick="runImage()">Generate Picture</button>
    <button class="btn-clear" type="button" onclick="clearImageSection()" style="margin-top: 10px;">Clear</button>
  </div>

  <div id="imageStatus" class="status-text"></div>
  <div id="imageBox"><img id="sceneImg" /></div>

  <script>
    let lastGeneratedStory = '';

    function appendToStorySoFar() {
      const soFar = document.getElementById('storySoFar');
      if (lastGeneratedStory) {
        soFar.value = soFar.value ? `${soFar.value}\n\n${lastGeneratedStory}` : lastGeneratedStory;
        document.getElementById('premise').value = '';
        alert('Appended to Story So Far! You can now enter the next scene.');
      }
    }

    function clearStorySection() {
      document.getElementById('genre').value = '';
      document.getElementById('characters').value = '';
      document.getElementById('storySoFar').value = '';
      document.getElementById('premise').value = '';
      document.getElementById('instructions').value = '';
      const box = document.getElementById('storyBox');
      box.innerText = '';
      box.style.display = 'none';
      document.getElementById('appendBtn').style.display = 'none';
      lastGeneratedStory = '';
    }

    function clearImageSection() {
      document.getElementById('imgPrompt').value = '';
      const box = document.getElementById('imageBox');
      const img = document.getElementById('sceneImg');
      img.src = '';
      box.style.display = 'none';
      document.getElementById('imageStatus').innerText = '';
    }

    async function runStory() {
      const btn = document.getElementById('storyBtn');
      const box = document.getElementById('storyBox');
      const appendBtn = document.getElementById('appendBtn');
      btn.innerText = "Writing...";
      btn.disabled = true;

      try {
        const res = await fetch('/api/generate-story', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            language: document.getElementById('language').value,
            stage: document.getElementById('stage').value,
            length: document.getElementById('length').value,
            genre: document.getElementById('genre').value,
            characters: document.getElementById('characters').value,
            storySoFar: document.getElementById('storySoFar').value,
            premise: document.getElementById('premise').value,
            instructions: document.getElementById('instructions').value
          })
        });
        const data = await res.json();
        if (data.story) {
          lastGeneratedStory = data.story;
          box.style.display = 'block';
          box.innerText = data.story;
          appendBtn.style.display = 'block';
        } else {
          box.style.display = 'block';
          box.innerText = "Error: " + (data.error || "Server issue");
        }
      } catch (e) {
        alert("Story generation error: " + e.message);
      }
      btn.innerText = "Write Story";
      btn.disabled = false;
    }

    async function runImage() {
      const btn = document.getElementById('imgBtn');
      const box = document.getElementById('imageBox');
      const img = document.getElementById('sceneImg');
      const status = document.getElementById('imageStatus');
      const prompt = document.getElementById('imgPrompt').value;
      const style = document.getElementById('imageStyle').value;

      if (!prompt.trim()) {
        alert("Please enter a description in the Image Prompt box.");
        return;
      }

      btn.disabled = true;
      btn.innerText = "Generating...";
      status.innerText = "Rendering picture (~10-15s)...";

      try {
        const fullPrompt = `${prompt}, ${style}`;
        const res = await fetch('/api/generate-image', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ prompt: fullPrompt })
        });

        const data = await res.json();
        if (data.imageUrl) {
          img.src = data.imageUrl;
          box.style.display = 'block';
          status.innerText = "";
        } else {
          status.innerText = "";
          alert("Error: " + (data.error || "Generation failed"));
        }
      } catch (e) {
        status.innerText = "";
        alert("Request error: " + e.message);
      }
      btn.innerText = "Generate Picture";
      btn.disabled = false;
    }
  </script>
</body>
</html>
